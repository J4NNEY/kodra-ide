name: Release

# Tag a commit with `v<version>` (for example v1.0.0) to build and publish a
# Windows x64 installer. The version in src-tauri/tauri.conf.json,
# package.json and src-tauri/Cargo.toml must match the tag.
#
# Optional code signing (Settings -> Secrets and variables -> Actions):
#   KODRA_SIGN_PFX_BASE64   base64 of the .pfx file
#   KODRA_SIGN_PFX_PASSWORD password for the .pfx
#   KODRA_TIMESTAMP_URL     RFC 3161 timestamp server (optional)
#
# Optional repository variable:
#   KODRA_UPDATE_BASE_URL   public base URL that hosts the installer, used to
#                           build latest.json (default https://downloads.kodra.app)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGN_PFX_BASE64: ${{ secrets.KODRA_SIGN_PFX_BASE64 }}
      KODRA_SIGN_PFX_PASSWORD: ${{ secrets.KODRA_SIGN_PFX_PASSWORD }}
      KODRA_TIMESTAMP_URL: ${{ secrets.KODRA_TIMESTAMP_URL }}
      KODRA_UPDATE_BASE_URL: ${{ vars.KODRA_UPDATE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}" -and "${{ github.event_name }}" -eq "push") {
            throw "Tag ${{ github.ref_name }} does not match app version $version"
          }
          "KODRA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare signing certificate
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'kodra-sign.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "KODRA_SIGN_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build, test and package
        shell: pwsh
        run: |
          $base = $env:KODRA_UPDATE_BASE_URL
          if (-not $base) {
            $base = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          }
          pnpm release:win -UpdateBaseUrl $base

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kodra-${{ env.KODRA_VERSION }}-windows-x64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Kodra ${{ env.KODRA_VERSION }}
          draft: true
          files: release/*
          fail_on_unmatched_files: true
