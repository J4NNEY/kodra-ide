[package]
name = "kudo"
version = "0.2.0"
description = "Kudo — desktop IDE"
authors = ["Kudo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "kudo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
futures-util = "0.3"
portable-pty = "0.9"
notify = "8"
dirs = "6"
walkdir = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
once_cell = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
